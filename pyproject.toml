[project]
name = "itm_trans"
authors = [
    { name = "envision", email = "info@envision.com"}
]
description = "this is for translation"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "deep-translator"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe Cloud reads this to decide which Frappe version this app may be
# deployed against. Without it, "Add app from GitHub" fails validation with
# "Could not find a compatible Frappe version in pyproject.toml".
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
